<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Puzzle AR</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    * { margin: 0; padding: 0; }
    body { overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
    
    #start-overlay {
      position: fixed; inset: 0; z-index: 9999;
      background: #000; color: #fff;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    #start-overlay h1 { font-size: 1.5rem; margin-bottom: 1rem; }
    #start-overlay button {
      padding: 1rem 3rem; font-size: 1.2rem; font-weight: bold;
      border: none; border-radius: 12px; cursor: pointer;
      background: #3ddca0; color: #000;
      box-shadow: 0 4px 15px rgba(61, 220, 160, 0.4);
    }
    
    /* Mute Toggle Button */
    #audio-toggle {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      z-index: 9000;
      background: rgba(0,0,0,0.8);
      color: #3ddca0;
      border: 2px solid #3ddca0;
      padding: 12px 28px;
      border-radius: 30px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      display: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <div id="start-overlay">
    <h1>Puzzle AR Scanner</h1>
    <button onclick="begin()">Tap to Start</button>
  </div>

  <button id="audio-toggle" onclick="toggleAudio()">🔇 Unmute Sound</button>

  <script>
    let isMuted = true;
    
    function toggleAudio() {
      const vid = document.getElementById('vid');
      if (!vid) return;
      
      if (isMuted) {
        vid.muted = false;
        isMuted = false;
        document.getElementById('audio-toggle').innerHTML = '🔊 Mute Sound';
        document.getElementById('audio-toggle').style.color = '#fff';
        document.getElementById('audio-toggle').style.borderColor = '#fff';
      } else {
        vid.muted = true;
        isMuted = true;
        document.getElementById('audio-toggle').innerHTML = '🔇 Unmute Sound';
        document.getElementById('audio-toggle').style.color = '#3ddca0';
        document.getElementById('audio-toggle').style.borderColor = '#3ddca0';
      }
    }

    function begin() {
      document.getElementById('start-overlay').remove();
      document.getElementById('audio-toggle').style.display = 'block';

      // Create the scene AFTER user gesture
      document.body.insertAdjacentHTML('beforeend', `
        <a-scene
          mindar-image="imageTargetSrc: /markers/convex-lens.mind; uiScanning: no; uiLoading: no;"
          color-space="sRGB"
          renderer="colorManagement: true"
          vr-mode-ui="enabled: false"
          device-orientation-permission-ui="enabled: false"
        >
          <a-assets>
            <video id="vid" src="/videos/convex-lens.mp4"
              preload="auto" loop="true" muted playsinline
              crossorigin="anonymous"></video>
          </a-assets>

          <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

          <!-- 
            rotation="0 0 -90" fixes the vertical orientation by rotating the video 90 degrees clockwise.
            width="1.4" height="1" stretches the video to match the landscape orientation.
          -->
          <a-entity mindar-image-target="targetIndex: 0">
            <a-plane
              src="#vid"
              position="0 0 0"
              rotation="0 0 -90"
              width="1.4"
              height="1"
              material="shader: flat; side: double"
            ></a-plane>
          </a-entity>
        </a-scene>
      `);

      setTimeout(() => {
        const vid = document.getElementById('vid');
        const target = document.querySelector('[mindar-image-target]');

        if (target && vid) {
          target.addEventListener('targetFound', () => {
            console.log('TARGET FOUND');
            vid.play().catch(e => console.error('play failed:', e));
          });

          target.addEventListener('targetLost', () => {
            console.log('TARGET LOST');
            vid.pause();
          });
        }
      }, 1000);
    }
  </script>

</body>
</html>
